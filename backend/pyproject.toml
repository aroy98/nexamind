[project]
name = "ai-knowledge-inbox-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "sentence-transformers",
    "requests",
    "beautifulsoup4",
    "numpy",
    "python-dotenv",
    "httpx",
]

[project.scripts]
dev = "app.dev:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
