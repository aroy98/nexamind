[project]
name = "ai-knowledge-inbox-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "sentence-transformers",
    "requests",
    "beautifulsoup4",
    "numpy",
    "python-dotenv",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
